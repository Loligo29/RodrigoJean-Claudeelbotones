<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050916">
<title>Mensaje Especial</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#ffd23f;
  --soft:#ffe27a;
  --cream:#fff6d6;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050916}
body{
  font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--cream);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}

/* ---------- Escena (canvas) ---------- */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;display:block}
.vignette{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(2,4,14,.55) 100%);
}

/* ---------- Pantallas ---------- */
.screen{
  position:fixed;inset:0;z-index:3;display:flex;
  overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(22px + var(--safe-t)) 20px calc(15vh + var(--safe-b));
  pointer-events:none;
  transition:opacity 1s ease,transform 1s ease,visibility 1s;
}
.screen.hidden{opacity:0;visibility:hidden;transform:scale(1.05)}
.wrap{margin:auto;width:100%;max-width:640px;text-align:center;pointer-events:auto}

/* ---------- Portada ---------- */
.reveal{
  opacity:0;transform:translateY(20px);
  animation:up 1.1s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:calc(var(--i) * .2s + .3s);
}
@keyframes up{to{opacity:1;transform:none}}

h1{
  font-family:'Playfair Display',Georgia,'Times New Roman',serif;
  font-weight:800;text-transform:uppercase;line-height:1.04;letter-spacing:.04em;
}
h1 .pre{
  display:block;font-family:'Montserrat',system-ui,sans-serif;font-weight:600;
  font-size:clamp(.78rem,3.3vw,1.02rem);letter-spacing:.38em;
  color:var(--cream);opacity:.92;margin-bottom:.8rem;
}
.shimmer{
  background:linear-gradient(100deg,#ffb703 0%,#fff4b0 22%,#ffd23f 45%,#ff9f1c 70%,#ffb703 100%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shimmer 4.5s linear infinite;
}
@keyframes shimmer{to{background-position:-260% 0}}
h1 .big{
  display:block;font-size:clamp(2.5rem,12.5vw,4.6rem);
  filter:drop-shadow(0 0 16px rgba(255,190,30,.4));
}

.divider{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:1.2rem auto .5rem;max-width:280px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,63,.75))}
.divider i:last-child{transform:scaleX(-1)}
.divider svg{width:18px;height:18px;fill:var(--gold);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.3)}36%{transform:scale(1)}54%{transform:scale(1.2)}}

.script{
  font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;line-height:1.1;
  font-size:clamp(2.1rem,8vw,3rem);color:var(--soft);text-shadow:0 0 22px rgba(255,190,30,.55);
}
.name{
  display:flex;justify-content:center;align-items:center;gap:.5rem;
  font-family:'Great Vibes','Brush Script MT',cursive;line-height:1.05;
  font-size:clamp(4rem,19vw,6.4rem);margin-top:-.1em;
}
.name .shimmer{padding:0 .14em .06em;filter:drop-shadow(0 0 20px rgba(255,190,30,.6))}
.tw{width:clamp(18px,5vw,28px);height:clamp(18px,5vw,28px);fill:#fff3b0;flex:none;animation:tw 2.4s ease-in-out infinite}
.tw.b{animation-delay:1.1s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}
.lead{
  margin:.5rem 0 2rem;font-size:clamp(.72rem,3vw,.92rem);font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;opacity:.94;
}

/* ---------- Botones ---------- */
.btn{
  position:relative;overflow:hidden;cursor:pointer;border:0;
  display:inline-flex;align-items:center;gap:.75em;
  font:600 .9rem/1 'Montserrat',system-ui,sans-serif;
  letter-spacing:.2em;text-transform:uppercase;color:#2a1600;
  padding:1.15rem 2.3rem;border-radius:999px;
  background:linear-gradient(135deg,#fff0a0 0%,#ffd23f 42%,#ffab00 100%);
  box-shadow:0 10px 30px rgba(255,170,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
  animation:pulse 2.4s ease-in-out infinite;
  transition:transform .25s ease;
}
.btn>*{position:relative}
.btn::before{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite;
}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:scale(.96)}
.btn.sm{padding:.95rem 1.5rem;font-size:.78rem}
@keyframes pulse{
  0%,100%{box-shadow:0 10px 30px rgba(255,170,0,.35),0 0 0 0 rgba(255,210,63,.55),inset 0 1px 0 rgba(255,255,255,.7)}
  50%{box-shadow:0 12px 38px rgba(255,170,0,.5),0 0 0 16px rgba(255,210,63,0),inset 0 1px 0 rgba(255,255,255,.7)}
}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.ghost{
  cursor:pointer;color:var(--soft);
  background:rgba(12,8,40,.45);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,210,63,.45);border-radius:999px;
  padding:.85rem 1.1rem;font:500 .68rem/1 'Montserrat',system-ui,sans-serif;
  letter-spacing:.16em;text-transform:uppercase;
  transition:background .25s,transform .25s;
}
.ghost:hover{background:rgba(255,210,63,.18);transform:translateY(-2px)}
.ghost:active{transform:scale(.96)}
:focus-visible{outline:2px solid #fff;outline-offset:4px}

/* ---------- Pantalla del regalo ---------- */
#gift{
  flex-direction:column;align-items:center;overflow:hidden;
  padding:calc(62px + var(--safe-t)) 16px 0;
}
.gift-title{
  font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;
  font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.15;text-align:center;
  color:var(--soft);pointer-events:none;
}
.gift-title .l{
  display:inline-block;opacity:0;transform:translateY(26px) scale(.6);filter:blur(6px);
  text-shadow:0 0 14px rgba(255,190,30,.6);
}
.gift-title .n .l{font-size:1.28em}
#gift.play .l{
  animation:
    letterIn .9s cubic-bezier(.2,1.4,.4,1) calc(var(--k) * .07s + .3s) forwards,
    wave 3s ease-in-out calc(var(--k) * .14s + 1.5s) infinite;
}
@keyframes letterIn{to{opacity:1;transform:none;filter:none}}
@keyframes wave{
  0%,100%{text-shadow:0 0 12px rgba(255,190,30,.6)}
  50%{text-shadow:0 0 30px rgba(255,225,100,1),0 0 6px #fff}
}

.panel{
  position:relative;width:min(92vw,520px);margin-top:.5rem;padding:1.05rem 1.3rem 1.1rem;
  border-radius:24px;pointer-events:auto;text-align:center;
  background:linear-gradient(160deg,rgba(255,240,170,.13),rgba(30,20,90,.32));
  border:1px solid rgba(255,210,63,.3);
  box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;transform:translateY(-16px) scale(.97);
  transition:opacity .9s ease,transform .9s ease;
}
.panel.show{opacity:1;transform:none}
.dots{display:flex;justify-content:center;gap:.5rem;margin-bottom:.8rem}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,226,122,.25);transition:all .4s}
.dots i.done{background:rgba(255,226,122,.65)}
.dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:scale(1.35)}
.msg{
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;
  font-size:clamp(1.15rem,4.5vw,1.42rem);line-height:1.5;color:#fff3c9;
}
.rest{visibility:hidden}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--gold);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.controls{
  position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:.7rem;pointer-events:none;
}
.controls>*{pointer-events:auto}
.controls{opacity:0;transition:opacity .9s ease}
.controls.show{opacity:1}
.hint{
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#fff3c9;
  background:rgba(12,8,40,.5);padding:.5rem .95rem;border-radius:999px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity 1s ease;pointer-events:none!important;
}
.hint.show{opacity:1}
.row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.row[hidden]{display:none}

.counter{
  position:fixed;z-index:5;top:calc(14px + var(--safe-t));left:14px;height:40px;
  display:flex;align-items:center;gap:.5rem;padding:0 1rem 0 .8rem;border-radius:999px;
  font-size:.7rem;letter-spacing:.06em;color:var(--soft);
  background:rgba(12,8,40,.55);border:1px solid rgba(255,210,63,.4);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s,transform .3s;
}
.counter svg{width:20px;height:20px;fill:var(--gold)}
.counter b{font-weight:600;color:#fff;font-size:.9rem}
.counter.bump{transform:scale(1.12)}
body.opened .counter,body.opened .music{opacity:1;visibility:visible}

.music{
  position:fixed;z-index:5;top:calc(14px + var(--safe-t));right:14px;
  width:44px;height:44px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;color:var(--soft);
  background:rgba(12,8,40,.55);border:1px solid rgba(255,210,63,.4);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s,transform .25s;
}
.music:active{transform:scale(.92)}
.music.off .on{display:none}
.music:not(.off) .off-i{display:none}

@media (prefers-reduced-motion:reduce){
  .reveal,.gift-title .l{animation-duration:.01ms!important;animation-delay:0s!important}
  .shimmer,.tw,.btn,.btn::before,.divider svg{animation:none!important}
  .reveal{opacity:1;transform:none}
  .gift-title .l{opacity:1;transform:none;filter:none}
}
</style>
</head>

<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="counter" id="counter" aria-live="polite">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><g><ellipse cx="12" cy="5" rx="2.2" ry="3.4"/><ellipse cx="12" cy="19" rx="2.2" ry="3.4"/><ellipse cx="5" cy="12" rx="3.4" ry="2.2"/><ellipse cx="19" cy="12" rx="3.4" ry="2.2"/><ellipse cx="7" cy="7" rx="2.2" ry="3.2" transform="rotate(-45 7 7)"/><ellipse cx="17" cy="17" rx="2.2" ry="3.2" transform="rotate(-45 17 17)"/><ellipse cx="17" cy="7" rx="2.2" ry="3.2" transform="rotate(45 17 7)"/><ellipse cx="7" cy="17" rx="2.2" ry="3.2" transform="rotate(45 7 17)"/></g></svg>
  <span><b id="cnt">0</b> plantadas</span>
</div>

<button id="music" class="music" type="button" aria-label="Activar o silenciar la música" aria-pressed="true">
  <svg class="on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  <svg class="off-i" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 4v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2.1a9 9 0 0 0 3.6-1.8l2.1 2.1 1.3-1.3L4.3 3zM12 5 9.9 7.1 12 9.2V5z"/></svg>
</button>

<!-- ============ PORTADA ============ -->
<section id="intro" class="screen">
  <div class="wrap">
    <h1 class="reveal" style="--i:0">
      <span class="pre">Feliz día de las</span>
      <span class="big shimmer">Flores</span>
      <span class="big shimmer">Amarillas</span>
    </h1>

    <div class="divider reveal" style="--i:1" aria-hidden="true">
      <i></i>
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <i></i>
    </div>

    <p class="script reveal" style="--i:2">Amor mío</p>
    <p class="name reveal" style="--i:3">
      <svg class="tw" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-11Q1.2-1.2 11 0 1.2 1.2 0 11-1.2 1.2-11 0-1.2-1.2 0-11Z"/></svg>
      <span class="shimmer" id="introName">Melina</span>
      <svg class="tw b" viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-11Q1.2-1.2 11 0 1.2 1.2 0 11-1.2 1.2-11 0-1.2-1.2 0-11Z"/></svg>
    </p>
    <p class="lead reveal" style="--i:4">Tengo un regalo especial para ti</p>

    <div class="reveal" style="--i:5"><button id="openBtn" class="btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-2.2A3 3 0 0 0 12 4.6 3 3 0 0 0 6.2 7H4a2 2 0 0 0-2 2v3h20V9a2 2 0 0 0-2-2zM9 7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm6 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM3 14v5a2 2 0 0 0 2 2h6v-7H3zm10 7h6a2 2 0 0 0 2-2v-5h-8v7z"/></svg>
      <span>Ver tu regalo</span>
    </button></div>
  </div>
</section>

<!-- ============ REGALO ============ -->
<section id="gift" class="screen hidden">
  <h2 class="gift-title" id="giftTitle"></h2>

  <div class="panel" id="panel">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <p class="msg" id="msg"></p>
  </div>

  <div class="controls">
    <div class="hint" id="hint">Toca el campo para plantar flores</div>

    <div class="row" id="rowNext">
      <button id="next" class="btn sm" type="button">
        <span>Siguiente</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <div class="row" id="rowEnd" hidden>
      <button id="surprise" class="btn sm" type="button"><span>Sorpresa</span>
        <svg viewBox="-12 -12 24 24" aria-hidden="true"><path d="M0-11Q1.2-1.2 11 0 1.2 1.2 0 11-1.2 1.2-11 0-1.2-1.2 0-11Z"/></svg>
      </button>
      <button id="reread" class="ghost" type="button">Releer</button>
      <button id="home" class="ghost" type="button">Inicio</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

/* =====================================================
   PERSONALIZA AQUÍ
   ===================================================== */
const CONFIG = {
  nombre: 'Melina',
  mensajes: [
    'Feliz día de las flores amarillas, Melina.',
    'Tu nombre lo dice todo: eres mi Melina, la luz que aparece justo cuando más la necesito.',
    'Estas flores son pequeñas al lado de lo que siento, pero quise que crecieran solo para ti.',
    'Gracias por tu sonrisa, por tu paciencia y por hacer bonito hasta el día más gris.',
    'Si pudiera, te regalaría un campo entero... y aun así me faltaría espacio para todo mi cariño.',
    'Te amo, Melina. Hoy y todos los días.'
  ],
  musica: true        // true = música suave al abrir el regalo
};
/* ===================================================== */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

/* ---------- referencias ---------- */
const cv = $('#scene'), cx = cv.getContext('2d');
const intro = $('#intro'), gift = $('#gift'), panel = $('#panel'), msgEl = $('#msg'), dotsEl = $('#dots');
const hint = $('#hint'), rowNext = $('#rowNext'), rowEnd = $('#rowEnd');
const musicBtn = $('#music'), counter = $('#counter'), cntEl = $('#cnt');
$('#introName').textContent = CONFIG.nombre;

/* =====================================================
   MÚSICA (Web Audio, sin archivos)
   ===================================================== */
const Music = (() => {
  let ac, master, timer, next = 0, step = 0, playing = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const CH = [
    { b: 48, n: [64, 67, 72, 76] },
    { b: 43, n: [62, 67, 71, 74] },
    { b: 45, n: [60, 64, 69, 72] },
    { b: 41, n: [60, 65, 69, 72] }
  ];
  const PAT = [0, 1, 2, 3, 2, 1, 3, 2];

  function tone(freq, t, dur, vol, type, att) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (att || .015));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .05);
  }
  function schedule() {
    while (next < ac.currentTime + .4) {
      const c = CH[Math.floor(step / 8) % CH.length], i = step % 8;
      if (i === 0) {
        tone(mtof(c.b), next, 2.5, .15, 'triangle');
        [0, 1, 2].forEach(k => tone(mtof(c.n[k] - 12), next, 2.6, .028, 'sine', .6));
      }
      const m = c.n[PAT[i]];
      tone(mtof(m), next, 1.3, .085);
      tone(mtof(m + 12), next, .6, .022);
      next += .3; step++;
    }
  }
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = .9;
    const dly = ac.createDelay(); dly.delayTime.value = .38;
    const fb = ac.createGain(); fb.gain.value = .35;
    const wet = ac.createGain(); wet.gain.value = .4;
    master.connect(ac.destination);
    master.connect(dly); dly.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(ac.destination);
    return true;
  }
  document.addEventListener('visibilitychange', () => {
    if (!ac || !playing) return;
    document.hidden ? ac.suspend() : ac.resume();
  });
  return {
    get on() { return playing; },
    start() {
      try {
        if (!ac && !init()) return;
        playing = true; ac.resume();
        next = ac.currentTime + .1;
        clearInterval(timer); timer = setInterval(schedule, 100);
      } catch (e) { playing = false; }
    },
    stop() { playing = false; clearInterval(timer); if (ac) ac.suspend(); },
    blip(m) {
      if (!playing || !ac) return;
      const t = ac.currentTime;
      tone(mtof(m), t, .9, .07); tone(mtof(m + 12), t, .5, .03);
    }
  };
})();
const NOTES = [72, 74, 76, 79, 81, 84];
const chime = () => Music.blip(pick(NOTES));
function syncMusicBtn() {
  musicBtn.classList.toggle('off', !Music.on);
  musicBtn.setAttribute('aria-pressed', String(Music.on));
}

function petals(g, R) {
  const gr = g.createLinearGradient(0, -R.r0, 0, -R.r1);
  R.stops.forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.strokeStyle = R.edge; g.lineWidth = 1.3;
  const d = R.r1 - R.r0;
  for (let i = 0; i < R.n; i++) {
    g.save(); g.rotate(R.off + i * TAU / R.n);
    g.beginPath(); g.moveTo(0, -R.r0);
    g.bezierCurveTo(R.w * .9, -R.r0 - d * .25, R.w * 1.05, -R.r0 - d * .78, 0, -R.r1);
    g.bezierCurveTo(-R.w * 1.05, -R.r0 - d * .78, -R.w * .9, -R.r0 - d * .25, 0, -R.r0);
    g.fill(); g.stroke();
    if (R.vein) {
      g.strokeStyle = 'rgba(170,90,0,.28)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, -R.r0 - d * .12); g.lineTo(0, -R.r1 + d * .16); g.stroke();
      g.strokeStyle = R.edge; g.lineWidth = 1.3;
    }
    g.restore();
  }
}
function core(g, K) {
  const gr = g.createRadialGradient(-K.r * .2, -K.r * .2, K.r * .1, 0, 0, K.r);
  gr.addColorStop(0, K.c[0]); gr.addColorStop(.6, K.c[1]); gr.addColorStop(1, K.c[2]);
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, K.r, 0, TAU); g.fill();
  for (let i = 1; i <= K.seed; i++) {
    const rr = K.r * .94 * Math.sqrt(i / K.seed), a = i * 2.39996;
    g.globalAlpha = .55; g.fillStyle = K.sc[i % 2];
    g.beginPath(); g.arc(rr * Math.cos(a), rr * Math.sin(a), 1.2 + 2.2 * (i / K.seed), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  g.strokeStyle = 'rgba(255,200,90,.45)'; g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, K.r, 0, TAU); g.stroke();
}

function hill(g, by, amp, c1, c2, seed, rim) {
  const grad = g.createLinearGradient(0, H * (by - amp), 0, H);
  grad.addColorStop(0, c1); grad.addColorStop(1, c2);
  const pts = [];
  for (let x = 0; x <= W + 8; x += 8) {
    const t = x / W;
    pts.push([x, H * by + H * amp * (Math.sin(t * 5.2 + seed) + .6 * Math.sin(t * 11.3 + seed * 2) + .3 * Math.sin(t * 23 + seed * 3))]);
  }
  g.fillStyle = grad; g.beginPath(); g.moveTo(0, H);
  pts.forEach(p => g.lineTo(p[0], p[1]));
  g.lineTo(W, H); g.closePath(); g.fill();
  if (rim) {
    g.strokeStyle = 'rgba(255,200,100,.24)'; g.lineWidth = 1.5; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.stroke();
  }
}
function paintBG() {
  const g = bgx;

  g.clearRect(0, 0, W, H);
  const sky = g.createLinearGradient(0, 0, 0, H * .8);
  sky.addColorStop(0, '#040714'); sky.addColorStop(.35, '#0f1240'); sky.addColorStop(.65, '#352768');
  sky.addColorStop(.85, '#8f4a80'); sky.addColorStop(1, '#f2a24c');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  g.save(); g.translate(W * .5, H * .8); g.scale(1, .42);
  const gl = g.createRadialGradient(0, 0, 0, 0, 0, W * .85);
  gl.addColorStop(0, 'rgba(255,190,80,.6)'); gl.addColorStop(1, 'rgba(255,190,80,0)');
  g.fillStyle = gl; g.fillRect(-W, -H * 2, W * 2, H * 4); g.restore();

  const mx = W * .84, my = H * .2, mr = Math.max(20, 24 * U);
  const mg = g.createRadialGradient(mx, my, mr * .6, mx, my, mr * 5);
  mg.addColorStop(0, 'rgba(255,240,200,.35)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = mg; g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  const md = g.createRadialGradient(mx - mr * .3, my - mr * .3, mr * .1, mx, my, mr);
  md.addColorStop(0, '#fffdf0'); md.addColorStop(1, '#f0dc9c');
  g.fillStyle = md; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
  g.fillStyle = 'rgba(160,130,60,.18)';
  [[-.3, -.1, .22], [.25, .2, .16], [.05, -.4, .12], [-.1, .35, .1]].forEach(c => {
    g.beginPath(); g.arc(mx + c[0] * mr, my + c[1] * mr, c[2] * mr, 0, TAU); g.fill();
  });

  hill(g, .70, .02, '#2b2466', '#1b1a4d', .6, false);
  hill(g, .76, .026, '#173a48', '#0f2a36', 1.7, false);
  hill(g, .83, .018, '#0f2f22', '#08180f', 2.9, true);

  const fog = g.createLinearGradient(0, H * .84, 0, H);

  g.fillStyle = fog; g.fillRect(0, H * .84, W, H * .16);
}

const LAY = [
  { ny: [.80, .84], hh: [.24, .42], hr: [17, 24], sw: 2.6, tone: 2, stem: '#1f5a3c', leaf: '#2a7048', dens: 44, ls: .75 },
  { ny: [.88, .92], hh: [.28, .50], hr: [24, 34], sw: 3.6, tone: 1, stem: '#2f7a3f', leaf: '#3f9450', dens: 58, ls: .95 },
  { ny: [.96, .99], hh: [.32, .58], hr: [34, 50], sw: 5.2, tone: 0, stem: '#4a9a3a', leaf: '#63b046', dens: 84, ls: 1.2 }
];
const flowers = [];
let planted = 0;

function makeFlower(li, nx, ny) {
  const L = LAY[li];
  const kind = pick(['sunA', 'sunA', 'sunB', 'sunB', 'daisyA', 'daisyB']);
  const hr = rand(L.hr[0], L.hr[1]) * (kind[0] === 'd' ? .88 : 1);
  let hh = rand(L.hh[0], L.hh[1]);
  hh = Math.max(.1, Math.min(hh, ny - .36 - hr * U / H));
  const nl = li === 0 ? 2 : 3, leaves = [];
  for (let i = 0; i < nl; i++) {
    leaves.push({ u: .18 + .42 * (i / (nl - 1)) + rand(-.04, .04), side: i % 2 ? 1 : -1, len: rand(16, 26) * L.ls, ph: rand(0, TAU) });
  }
  return {
    layer: li, kind, nx, ny, hh, hr, leaves,
    lean: rand(-.09, .09), ph: rand(0, TAU), spin: rand(-.35, .35), tilt: rand(.8, 1), dir: Math.random() < .5 ? -1 : 1,
    g: 0, b: 0, gd: 1.8, bd: .95, start: 0, die: false,
    kick: 0, kv: 0, pop: 0, tx: 0, ty: 0, R: 1, extra: false
  };
}
function createField() {
  flowers.length = 0;
  LAY.forEach((L, li) => {
    const n = Math.max(3, Math.round(W / (L.dens * U)));
    const step = 1 / n;
    for (let i = 0; i < n; i++) {
      const nx = clamp((i + .5) * step + rand(-.4, .4) * step, .02, .98);
      const f = makeFlower(li, nx, rand(L.ny[0], L.ny[1]));
      f.start = T + .25 + nx * 2.0 + li * .12 + rand(0, .45);
      f.gd = rand(1.5, 2.2);
      flowers.push(f);
    }
  });
  flowers.sort((a, b) => a.ny - b.ny);
}
function plantFlower(x, y) {
  const ny = clamp(y / H, .76, .99);
  const li = ny < .85 ? 0 : ny < .93 ? 1 : 2;
  const f = makeFlower(li, clamp(x / W, .01, .99), ny);
  f.start = T; f.gd = .75; f.bd = .55; f.extra = true;
  flowers.push(f);
  flowers.sort((a, b) => a.ny - b.ny);
  planted++;
  cntEl.textContent = planted;
  counter.classList.add('bump'); setTimeout(() => counter.classList.remove('bump'), 250);
  for (let i = 0; i < 12; i++) spark(x, y, rand(-2, 2), rand(-3.5, -.5), pick(['gold', 'white', 'warm']), rand(.7, 1.3), rand(2, 4), .05);
  chime();
  if (flowers.filter(q => q.extra).length > 70) {           // limitar rendimiento
    const idx = flowers.findIndex(q => q.extra && !q.die);
    if (idx >= 0) flowers[idx].die = true;

function drawFlowers(dts, dtf) {
  for (const f of flowers) {
    if (f.die) { if (f.b > 0) f.b = Math.max(0, f.b - dts / .35); else f.g = Math.max(0, f.g - dts / .6); }
    else if (T >= f.start) { if (f.g < 1) f.g = Math.min(1, f.g + dts / f.gd); else if (f.b < 1) f.b = Math.min(1, f.b + dts / f.bd); }
    f.kv += (-.06 * f.kick - .05 * f.kv) * dtf; f.kick += f.kv * dtf;
    f.pop = Math.max(0, f.pop - dts * 1.6);
    if (f.g <= .002) continue;

    const L = LAY[f.layer], bx = f.nx * W, by = f.ny * H, h = f.hh * H;
    const gU = easeOut(f.g);
    const lean = f.lean * h;
    const wp = (Math.sin(T * .9 + f.ph) * .028 + Math.sin(T * .37 + f.ph * 2) * .02 + f.kick) * h;
    const N = 14, xs = [], ys = [];
    for (let j = 0; j <= N; j++) { const u = gU * j / N; xs.push(bx + (lean + wp) * u * u); ys.push(by - h * u); }

    cx.strokeStyle = L.stem; cx.lineWidth = L.sw * U; cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.beginPath(); cx.moveTo(xs[0], ys[0]);
    for (let j = 1; j <= N; j++) cx.lineTo(xs[j], ys[j]);
    cx.stroke();

    for (const lf of f.leaves) {                       // hojas
      if (gU <= lf.u) continue;
      const s = easeBack(clamp((gU - lf.u) / .28, 0, 1));
      const idx = lf.u / gU * N, i0 = Math.min(N - 1, Math.floor(idx)), fr = idx - i0;
      const lx = xs[i0] + (xs[i0 + 1] - xs[i0]) * fr, ly = ys[i0] + (ys[i0 + 1] - ys[i0]) * fr;
      const tilt = Math.atan2(xs[i0 + 1] - xs[i0], ys[i0] - ys[i0 + 1]);
      const len = lf.len * U;
      cx.save();
      cx.translate(lx, ly); cx.rotate(-Math.PI / 2 + tilt + lf.side * (.95 + Math.sin(T * 1.6 + lf.ph) * .06)); cx.scale(s, s);
      cx.fillStyle = L.leaf;
      cx.beginPath(); cx.moveTo(0, 0);
      cx.bezierCurveTo(len * .3, -len * .32, len * .75, -len * .3, len, 0);
      cx.bezierCurveTo(len * .75, len * .3, len * .3, len * .32, 0, 0); cx.fill();
      cx.strokeStyle = 'rgba(255,255,255,.18)'; cx.lineWidth = 1;
      cx.beginPath(); cx.moveTo(len * .05, 0); cx.lineTo(len * .85, 0); cx.stroke();
      cx.restore();
    }

    const tx = xs[N], ty = ys[N], R = f.hr * U;
    const rot = Math.atan2(xs[N] - xs[N - 1], ys[N - 1] - ys[N]);
    f.tx = tx; f.ty = ty; f.R = R;

    if (f.b < .4 && gU > .85) {                        // capullo
      const bs = (gU - .85) / .15 * (1 - f.b / .4);
      cx.fillStyle = L.leaf; cx.beginPath();
      cx.ellipse(tx, ty, R * .28 * bs, R * .42 * bs, rot, 0, TAU); cx.fill();
    }
    if (f.b > 0) {                                     // flor abierta
      const s = easeBack(f.b) * (1 + f.pop * .28) * (1 + Math.sin(T * 2 + f.ph) * .012);
      cx.save();
      cx.translate(tx, ty); cx.rotate(rot * .6);
      cx.scale(s, s * f.tilt);
      cx.rotate(T * f.spin + (1 - f.b) * -2.2 * f.dir);
      cx.drawImage(SPR[f.kind][L.tone], -R, -R, R * 2, R * 2);
      cx.restore();
      if (f.b >= 1 && !reduce && Math.random() < .0007 * dtf) shedPetal(tx, ty);
    }
  }
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i]; if (f.die && f.g <= .002 && f.b <= 0) flowers.splice(i, 1);
  }
}
function drawHalos() {
  for (const f of flowers) {
    if (f.b <= .4) continue;
    cx.globalAlpha = f.b * (.15 + f.pop * .3);
    const S = f.R * 4.2;
    cx.drawImage(GLOW.gold, f.tx - S / 2, f.ty - S / 2, S, S);
  }
  cx.globalAlpha = 1;
}

/* =====================================================
   PARTÍCULAS: pétalos, corazones y chispas
   ===================================================== */
const parts = [], sparks = [];
const PETAL = ['#ffd23f', '#ffe066', '#ffb703', '#ffc93c', '#fff1a8'];
const HEARTS = ['#ff8fa3', '#ff5d8f', '#ffb703', '#ffd23f'];

function ambientPetal(initial) {
  return {
    t: 'petal', amb: true, flut: true, a: .85, x: rand(0, W), y: initial ? rand(0, H) : -20,
    vx: rand(-.2, .2), vy: rand(.5, 1.5), s: rand(5, 12), r: rand(0, TAU), vr: rand(-.03, .03),
    f: rand(0, TAU), vf: rand(.02, .06), sw: rand(0, TAU), c: pick(PETAL)
  };
}
function shedPetal(x, y) {
  parts.push({
    t: 'petal', flut: true, a: .95, x, y, vx: rand(-.4, .4), vy: rand(.2, .7), s: rand(6, 10), r: rand(0, TAU), vr: rand(-.05, .05),
    f: rand(0, TAU), vf: rand(.03, .07), sw: rand(0, TAU), c: pick(PETAL), life: 1, decay: .0035
  });
}
function spawnHeart() {
  parts.push({
    t: 'heart', amb: true, flut: true, a: .75, x: rand(20, W - 20), y: H + 20, vx: 0, vy: -rand(.6, 1.4),
    s: rand(5, 11), r: 0, vr: 0, f: 0, vf: 0, sw: rand(0, TAU), c: pick(HEARTS)
  });
}
function burst(x, y, n) {
  n = reduce ? Math.min(n, 8) : n;
  if (parts.length > 380) n = Math.min(n, 8);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(2, 8), heart = Math.random() > .78;
    parts.push({
      t: heart ? 'heart' : 'petal', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, g: .12, drag: .985,
      s: rand(5, 11), r: rand(0, 6), vr: rand(-.15, .15), f: rand(0, 6), vf: rand(.05, .15), sw: 0,
      c: heart ? pick(HEARTS) : pick(PETAL), life: 1, decay: rand(.006, .012), a: 1
    });
  }
}
function petalRain(n, ms) {
  for (let i = 0; i < n; i++) later(() => {
    const p = ambientPetal(false); p.amb = false; p.life = 1; p.decay = .003; p.vy = rand(1.5, 3); p.s = rand(6, 13);
    parts.push(p);
  }, (ms / n) * i);
}
function spark(x, y, vx, vy, col, life, size, g) {
  if (sparks.length > 650) return;
  sparks.push({ x, y, px: x, py: y, vx, vy, col, life: 1, decay: 1 / (life * 60), s: size, g: g === undefined ? .02 : g });
}
function heartBurst(x, y, sc) {
  const k = .26 * sc * Math.min(U, 1.6), n = reduce ? 40 : 110;
  for (let i = 0; i < n; i++) {
    const t = i / n * TAU;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    spark(x, y, hx * k, hy * k, i % 2 ? 'gold' : 'warm', 2.6, 3.4, .02);
    if (i % 2 === 0) spark(x, y, hx * k * .55, hy * k * .55, 'pink', 2.4, 3, .02);
  }
  spark(x, y, 0, 0, 'white', .5, 12, 0);
}
function ringBurst(x, y) {
  const n = reduce ? 24 : 70;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(3, 7) * Math.min(U, 1.5);
    spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, pick(['gold', 'white', 'pink', 'warm']), rand(1.2, 2), rand(2.4, 4), .04);
  }
  spark(x, y, 0, 0, 'white', .4, 14, 0);
}

function drawParts(dtf) {
  if (state === 'gift' && !reduce && T - lastHeart > .7 && parts.length < 300) { lastHeart = T; spawnHeart(); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.g) p.vy += p.g * dtf;
    if (p.drag) { const d = Math.pow(p.drag, dtf); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dtf; p.y += p.vy * dtf; p.r += p.vr * dtf; p.f += p.vf * dtf;
    if (p.flut) { p.sw += .012 * dtf; p.x += Math.sin(p.sw) * .35 * dtf; }
    if (p.t === 'heart' && p.amb) { p.r = Math.sin(p.sw) * .35; if (p.y < -30) { parts.splice(i, 1); continue; } }
    else if (p.amb && p.y > H + 30) { p.y = -20; p.x = rand(0, W); }
    if (p.life !== undefined) { p.life -= p.decay * dtf; if (p.life <= 0 || p.y > H + 60) { parts.splice(i, 1); continue; } }

    const life = p.life === undefined ? 1 : Math.max(0, p.life), s = p.s;
    cx.save();
    cx.globalAlpha = (p.a || 1) * Math.min(1, life * 1.5);
    cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.beginPath();
    if (p.t === 'petal') {
      cx.scale(1, Math.cos(p.f));
      cx.moveTo(0, -s); cx.bezierCurveTo(s * .95, -s * .55, s * .75, s * .75, 0, s);
      cx.bezierCurveTo(-s * .75, s * .75, -s * .95, -s * .55, 0, -s);
    } else {
      cx.moveTo(0, s * .9); cx.bezierCurveTo(-s * 1.6, -s * .2, -s * .7, -s * 1.3, 0, -s * .5);
      cx.bezierCurveTo(s * .7, -s * 1.3, s * 1.6, -s * .2, 0, s * .9);
    }
    cx.fill(); cx.restore();
  }
}
let lastHeart = 0;
function drawSparks(dtf) {
  const d = Math.pow(.965, dtf);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.px = p.x; p.py = p.y;
    p.vx *= d; p.vy = p.vy * d + p.g * dtf;
    p.x += p.vx * dtf; p.y += p.vy * dtf; p.life -= p.decay * dtf;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    const a = Math.min(1, p.life * 1.4), S = p.s * (.6 + p.life * .8) * 6;
    cx.globalAlpha = a;
    cx.drawImage(GLOW[p.col], p.x - S / 2, p.y - S / 2, S, S);
    cx.strokeStyle = `rgba(${RGB[p.col]},${a * .5})`; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(p.px, p.py); cx.lineTo(p.x, p.y); cx.stroke();
  }
  cx.globalAlpha = 1;
}

/* ---------- bucle principal ---------- */
function loop(now) {
  const dtf = Math.min((now - last) / 16.667, 3); last = now;
  const dts = dtf / 60; T += dts;
  starBoost = Math.max(0, starBoost - dts * .35);

  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  cx.clearRect(0, 0, W, H);
  cx.drawImage(bgc, 0, 0, W, H);
  drawStars(); drawMelina(); drawShoots(dtf);
  drawFlowers(dts, dtf);
  drawGrass();
  cx.globalCompositeOperation = 'lighter';
  drawHalos(); drawFlies(); drawSparks(dtf);
  cx.globalCompositeOperation = 'source-over';
  drawButterflies(dtf);
  drawParts(dtf);
  requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize', () => { resize(); fitPanel(); });
for (let i = 0; i < (reduce ? 10 : (W < 600 ? 24 : 42)); i++) parts.push(ambientPetal(true));
requestAnimationFrame(loop);

/* =====================================================
   INTERACCIÓN CON EL CAMPO
   ===================================================== */
let lastPX = null;
cv.addEventListener('pointerdown', e => {
  lastPX = e.clientX;
  const x = e.clientX, y = e.clientY;
  if (state !== 'gift') { burst(x, y, 8); chime(); return; }
  for (let i = flowers.length - 1; i >= 0; i--) {
    const f = flowers[i];
    if (f.b > .5 && Math.hypot(x - f.tx, y - f.ty) < f.R * 1.15) {
      f.pop = 1; f.kv += rand(-.03, .03);
      for (let k = 0; k < 8; k++) shedPetal(f.tx + rand(-f.R, f.R) * .5, f.ty + rand(-f.R, f.R) * .5);
      burst(f.tx, f.ty, 6); chime();
      return;
    }
  }
  if (y > H * .74) plantFlower(x, y);
  else { burst(x, y, 10); chime(); }
});
cv.addEventListener('pointermove', e => {
  if (state !== 'gift') return;
  const dx = lastPX === null ? 0 : e.clientX - lastPX; lastPX = e.clientX;
  const x = e.clientX, y = e.clientY;
  for (const f of flowers) {
    if (f.b > .5 && Math.hypot(x - f.tx, y - f.ty) < f.R * 1.6) f.kv += clamp(dx, -40, 40) * .0012;
  }
});
cv.addEventListener('pointerleave', () => { lastPX = null; });

/* =====================================================
   MENSAJES
   ===================================================== */
const timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearLater = () => timers.splice(0).forEach(clearTimeout);

let typeId = 0, typing = false, fast = false, idx = -1, finished = false;
const sleep = ms => (fast || reduce) ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const MSGS = CONFIG.mensajes;

dotsEl.innerHTML = MSGS.map(() => '<i></i>').join('');
function updateDots() {
  [...dotsEl.children].forEach((d, i) => { d.className = i < idx ? 'done' : i === idx ? 'on' : ''; });
}
function fitPanel() {                              // reserva el alto del mensaje más largo
  const keep = msgEl.innerHTML;
  panel.style.minHeight = '';
  let max = 0;
  MSGS.forEach(m => { msgEl.textContent = m; max = Math.max(max, panel.offsetHeight); });
  msgEl.innerHTML = keep;
  panel.style.minHeight = max + 'px';
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPanel);

async function typeText(text) {
  const id = ++typeId;
  typing = true; fast = false;
  msgEl.textContent = '';
  const t = document.createTextNode(''), c = document.createElement('span'), r = document.createElement('span');
  c.className = 'caret'; r.className = 'rest'; r.textContent = text;
  msgEl.append(t, c, r);
  for (let i = 0; i < text.length; i++) {
    if (id !== typeId) return;
    t.data = text.slice(0, i + 1); r.textContent = text.slice(i + 1);
    await sleep(/[.,;:!?]/.test(text[i]) ? rand(160, 260) : rand(20, 44));
  }
  if (id !== typeId) return;
  c.remove(); typing = false;
  onTyped();
}
function showMsg(i) {
  idx = i; updateDots(); typeText(MSGS[i]); chime();
}
function onTyped() {
  if (idx >= 0) hint.classList.add('show');
  if (idx === MSGS.length - 1 && !finished) {
    finished = true;
    rowNext.hidden = true; rowEnd.hidden = false;
    celebrate();
  }
}
function nextMsg() {
  if (typing) { fast = true; return; }
  if (idx < MSGS.length - 1) showMsg(idx + 1);
}

function celebrate() {
  starBoost = 1;
  heartBurst(W * .5, H * .27, 1.25);
  later(() => ringBurst(W * .22, H * .22), 450);
  later(() => ringBurst(W * .78, H * .2), 750);
  later(() => heartBurst(W * .5, H * .32, .8), 1300);
  later(() => ringBurst(W * .5, H * .16), 1700);
  petalRain(reduce ? 12 : 80, 3200);
  flowers.forEach((f, i) => later(() => { f.pop = 1; f.kv += rand(-.04, .04); }, i * 40));
  [72, 76, 79, 84, 88].forEach((m, i) => later(() => Music.blip(m), i * 140));
}

/* =====================================================
   FLUJO
   ===================================================== */
function buildTitle() {
  const el = $('#giftTitle');
  el.textContent = '';
  let k = 0;
  [['Para ti,', ''], [CONFIG.nombre, 'n']].forEach((w, wi) => {
    const s = document.createElement('span'); s.className = 'w ' + w[1];
    [...w[0]].forEach(ch => {
      const l = document.createElement('span'); l.className = 'l';
      l.textContent = ch === ' ' ? '\u00A0' : ch; l.style.setProperty('--k', k++);
      s.append(l);
    });
    el.append(s);
    if (wi === 0) el.append(' ');
  });
  el.setAttribute('aria-label', 'Para ti, ' + CONFIG.nombre);
}
buildTitle();

function openGift() {
  if (state === 'gift') return;
  state = 'gift';
  document.body.classList.add('opened');
  if (CONFIG.musica) Music.start();
  syncMusicBtn();
  const r = $('#openBtn').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 50);
  starBoost = 1;
  intro.classList.add('hidden');
  later(() => {
    gift.classList.remove('hidden');
    gift.classList.remove('play'); void gift.offsetWidth; gift.classList.add('play');
    createField();
    spawnButterflies();
    fitPanel();
  }, 600);
  later(() => { panel.classList.add('show'); $('.controls').classList.add('show'); startReading(); }, reduce ? 900 : 3300);
}
function startReading() {
  finished = false; idx = -1;
  rowNext.hidden = false; rowEnd.hidden = true;
  showMsg(0);
}
function goHome() {
  clearLater(); typeId++; typing = false;
  state = 'intro';
  flowers.forEach(f => { f.die = true; });
  butterflies.length = 0;
  panel.classList.remove('show'); hint.classList.remove('show'); $('.controls').classList.remove('show');
  gift.classList.add('hidden'); gift.classList.remove('play');
  intro.classList.remove('hidden');
  document.body.classList.remove('opened');
  planted = 0; cntEl.textContent = 0;
}

$('#openBtn').addEventListener('click', openGift);
$('#next').addEventListener('click', nextMsg);
$('#surprise').addEventListener('click', () => { celebrate(); });
$('#reread').addEventListener('click', () => { clearLater(); startReading(); });
$('#home').addEventListener('click', goHome);
musicBtn.addEventListener('click', () => { Music.on ? Music.stop() : Music.start(); syncMusicBtn(); });
})();
</script>
</body>
